name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    name: "Lint & Format Check"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "0.13.7"
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.14

    - name: Install dependencies
      run: make install

    - name: Check formatting and linting
      run: make lint

  type-check:
    runs-on: ubuntu-latest
    name: "Type Check"

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "0.13.7"
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.14

    - name: Install dependencies
      run: make install

    - name: Run type checking
      run: make typecheck

  test:
    runs-on: ubuntu-latest
    name: "Tests & Coverage (py${{ matrix.python-version }}, Django ${{ matrix.django-version }})"
    needs: [lint-and-format]  # Only run if linting passes

    strategy:
      fail-fast: false
      matrix:
        # Every Django series that pyproject.toml supports, each on the oldest and the newest Python
        # that both pyproject.toml and that Django series support.
        include:
          - { django-version: "5.0", python-version: "3.11" }
          - { django-version: "5.0", python-version: "3.12" }
          - { django-version: "5.1", python-version: "3.11" }
          - { django-version: "5.1", python-version: "3.13" }
          - { django-version: "5.2", python-version: "3.11" }
          - { django-version: "5.2", python-version: "3.14" }
          - { django-version: "6.0", python-version: "3.12" }
          - { django-version: "6.0", python-version: "3.14" }
          - { django-version: "6.1", python-version: "3.12" }
          - { django-version: "6.1", python-version: "3.14" }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "0.13.7"
        enable-cache: true

    - name: Set up Python
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: make install PYTHON_VERSION=${{ matrix.python-version }}

    - name: Run tests with coverage
      run: make coverage DJANGO_VERSION=${{ matrix.django-version }}
